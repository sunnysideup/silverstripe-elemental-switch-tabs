---
Name: elemental-switch-tabs
---
DNADesign\Elemental\Models\BaseElement:
  extensions:
    - Sunnysideup\ElementalSwitchTabs\Extensions\ElementalSwitchTabsExtension

SilverStripe\Admin\LeftAndMain:
  extra_requirements_css:
    - "sunnysideup/elemental-switch-tabs: client/dist/main.css"
  extensions:
    - Sunnysideup\ElementalSwitchTabs\Extensions\ApplyInlineEditableOverridesExtension


SilverStripe\Core\Injector\Injector:
  Psr\SimpleCache\CacheInterface.ElementalSwitchTabsInline:
    factory: SilverStripe\Core\Cache\CacheFactory
    constructor:
      namespace: 'ElementalSwitchTabsInline'


# per-block overrules (optional)
